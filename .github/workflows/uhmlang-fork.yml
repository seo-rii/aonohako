name: uhmlang-fork

on:
  pull_request:
    paths:
      - runtime-images.yml
      - internal/runtimepacks/uhmlang_fork_test.go
      - .github/workflows/uhmlang-fork.yml
  push:
    branches: [main]
    paths:
      - runtime-images.yml
      - internal/runtimepacks/uhmlang_fork_test.go
      - .github/workflows/uhmlang-fork.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build the catalog's pinned fork and verify smoke failures
        env:
          AONOHAKO_TEST_UHMLANG_LIVE: '1'
        run: go test -count=1 -timeout=8m -v ./internal/runtimepacks -run '^TestUHMLANG'
