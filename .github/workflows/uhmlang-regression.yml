name: uhmlang-regression

on:
  pull_request:
    paths:
      - third_party/umjunsik-lang-go/**
      - runtime-images.yml
      - docker/runtime.Dockerfile
      - .github/workflows/uhmlang-regression.yml
  push:
    branches: [main]
    paths:
      - third_party/umjunsik-lang-go/**
      - runtime-images.yml
      - docker/runtime.Dockerfile
      - .github/workflows/uhmlang-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build pinned interpreter and run CLI regressions
        run: |
          AONOHAKO_GO="$(command -v go)" \
            bash third_party/umjunsik-lang-go/build.sh "${RUNNER_TEMP}/umjunsik-lang-go"
