name: runtime-smoke

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      cache_ref:
        required: false
        type: string
        default: ""
      cache_write:
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: runtime-binaries-${{ github.sha }}
          path: ${{ runner.temp }}/aonohako-runtime-artifacts
      - run: |
          chmod 0755 "${RUNNER_TEMP}/aonohako-runtime-artifacts/aonohako-runtime-builder"
          echo "AONOHAKO_RUNTIME_BUILDER=${RUNNER_TEMP}/aonohako-runtime-artifacts/aonohako-runtime-builder" >> "${GITHUB_ENV}"
          echo "AONOHAKO_RUNTIME_BINARIES_CONTEXT=${RUNNER_TEMP}/aonohako-runtime-artifacts" >> "${GITHUB_ENV}"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - id: registry-login
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        if: inputs.cache_ref != ''
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: echo "AONOHAKO_DOCKER_CACHE_FROM=type=registry,ref=${{ inputs.cache_ref }}" >> "${GITHUB_ENV}"
        if: inputs.cache_ref != '' && steps.registry-login.outcome == 'success'
      - run: |
          echo "AONOHAKO_DOCKER_CACHE_TO=type=registry,ref=${{ inputs.cache_ref }},mode=min,oci-mediatypes=true,image-manifest=true,ignore-error=true" >> "${GITHUB_ENV}"
          echo "AONOHAKO_DOCKER_CACHE_TARGET=runtime-toolchain" >> "${GITHUB_ENV}"
        if: inputs.cache_write && steps.registry-login.outcome == 'success'
      - run: docker image prune -af
      - run: chmod +x scripts/build_runtime_images.sh scripts/smoke_runtime.sh
      - run: ./scripts/build_runtime_images.sh -mode ci -only "${{ inputs.image_name }}" -tag-prefix "aonohako-ci"
      - run: docker run --rm "aonohako-ci:${{ inputs.image_name }}" aonohako-smoke
