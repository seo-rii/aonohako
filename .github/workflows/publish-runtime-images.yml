name: publish-runtime-images

on:
  workflow_dispatch:
    inputs:
      profile:
        description: runtime image profile to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - type-a
          - type-b
          - type-c
          - type-d
          - type-e
          - type-f
          - type-g
          - type-h
          - type-i
          - type-j
          - type-k
          - type-l
          - type-m
          - type-n
          - type-o
          - type-p
          - type-q
          - type-r
          - type-s
      tag_prefix:
        description: image tag prefix
        required: true
        default: asia.gcr.io/hancomac/aonohako

concurrency:
  group: publish-runtime-images-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOCACHE: ${{ github.workspace }}/.cache/go-build
  GOMODCACHE: ${{ github.workspace }}/.cache/go-mod

jobs:
  runtime-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: matrix
        run: |
          matrix=$(go run ./cmd/runtime-matrix -mode production | jq -c --arg profile "${{ inputs.profile }}" '
            if $profile == "all" then
              [.[] | {name: .Name}]
            else
              [.[] | select(.Name == $profile) | {name: .Name}]
            end
          ')
          if [ "${matrix}" = "[]" ]; then
            echo "no runtime image profile matched ${{ inputs.profile }}" >&2
            exit 1
          fi
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  publish:
    runs-on: ubuntu-latest
    needs: runtime-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.runtime-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/175809265292/locations/global/workloadIdentityPools/github/providers/github-api
          service_account: deploy-oxus@hancomac.iam.gserviceaccount.com
      - name: Use docker login action
        uses: docker/login-action@v3
        with:
          registry: asia.gcr.io
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - run: chmod +x scripts/build_runtime_images.sh
      - name: Publish runtime image
        run: >
          ./scripts/build_runtime_images.sh
          -mode production
          -only "${{ matrix.name }}"
          -tag-prefix "${{ inputs.tag_prefix }}"
          -push
          -cache-from "type=gha,scope=aonohako-runtime-${{ matrix.name }}"
          -cache-to "type=gha,mode=max,scope=aonohako-runtime-${{ matrix.name }}"
