name: durante

on:
  pull_request:
    paths:
      - 'internal/**'
      - 'third_party/durante/**'
      - 'scripts/verify_durante_vendor.py'
      - 'docker/durante.Dockerfile'
      - 'go.*'
      - '.github/workflows/durante.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durante-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Select cached PyPy
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        timeout-minutes: 5
        with:
          python-version: 'pypy3.10-v7.3.19'
      - name: Select CPython for fixtures and SDK preparation
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        timeout-minutes: 5
        with:
          python-version: '3.12'
      - name: Verify build tools and expose selected interpreters to the sandbox
        shell: bash
        run: |
          set -euo pipefail
          for tool in gcc g++ cmake patch python3 pypy3; do command -v "$tool"; done
          # Sandbox targets use a fixed PATH. Bind only these disposable runner
          # aliases to the cached installations selected above, not a wrapper.
          for interpreter in python3 pypy3; do
            selected=$(command -v "$interpreter")
            case "$selected" in /opt/hostedtoolcache/*) ;; *) exit 1 ;; esac
            sudo ln -sfn "$selected" "/usr/local/bin/$interpreter"
            sudo "/usr/local/bin/$interpreter" --version
          done
          gcc --version
          cmake --version
      - name: Verify pinned engine and build instrumentation
        run: |
          python3 scripts/verify_durante_vendor.py
          python3 third_party/durante/toolkit/fetch_sdk.py
          # The sandbox drops credentials. Runner home directories need not be
          # traversable by that UID, so install exactly as in the runtime image.
          sudo mkdir -p /opt/durante
          sudo cp -a third_party/durante/toolkit/sdk/DynamoRIO-Linux-11.3.0-1 /opt/durante/dynamorio
          cmake -S third_party/durante/client -B /tmp/durante-build -DCMAKE_BUILD_TYPE=Release -DDynamoRIO_DIR=/opt/durante/dynamorio/cmake
          cmake --build /tmp/durante-build -j2
          gcc -O2 -Wall -Wextra -Werror -static internal/execute/testdata/durante/probe.c -o /tmp/durante-probe
          gcc -O2 -Wall -Wextra -Werror -static internal/execute/testdata/durante/interactive.c -o /tmp/durante-interactive
          gcc -O2 -Wall -Wextra -Werror -static internal/execute/testdata/durante/communication.c -o /tmp/durante-communication
      - name: Compile integration tests
        run: CGO_ENABLED=0 go test -c -o /tmp/durante-execute.test ./internal/execute
      - name: Validate ordinary sandbox and diagnostic resource limits
        run: |
          sudo env AONOHAKO_TEST_DURANTE=1 AONOHAKO_TEST_DURANTE_PYPY=1 AONOHAKO_ENFORCE_SANDBOX_TESTS=1 \
            AONOHAKO_DURANTE_DRRUN=/opt/durante/dynamorio/bin64/drrun \
            AONOHAKO_DURANTE_CLIENT=/tmp/durante-build/libdurante.so \
            AONOHAKO_DURANTE_TEST_BINARY=/tmp/durante-probe \
            /tmp/durante-execute.test -test.v -test.run '^TestDurante(Sandbox|ResourceEnvelope|PythonResourceEnvelope)Integration$' -test.timeout 180s
      - name: Validate interactive and communication measurement in an immutable image
        shell: bash
        run: |
          set -euo pipefail
          # Competitive fixtures bind to an actual container image identity.
          # The separately verified engine, client and test fixtures are mounted read-only.
          image=debian:trixie-slim@sha256:28de0877c2189802884ccd20f15ee41c203573bd87bb6b883f5f46362d24c5c2
          docker pull "$image"
          image_id=$(docker image inspect --format '{{.Id}}' "$image")
          docker run --rm --network none --read-only --memory 2g --pids-limit 256 --cpus 2 \
            --tmpfs /tmp:rw,exec,mode=1777,size=268435456 \
            --tmpfs /work:rw,exec,mode=0755,size=268435456 \
            --mount type=bind,src=/opt/durante/dynamorio,dst=/opt/durante/dynamorio,readonly \
            --mount type=bind,src=/tmp/durante-build/libdurante.so,dst=/opt/durante/lib/libdurante.so,readonly \
            --mount type=bind,src=/tmp/durante-execute.test,dst=/validation/execute.test,readonly \
            --mount type=bind,src=/tmp/durante-interactive,dst=/validation/interactive,readonly \
            --mount type=bind,src=/tmp/durante-communication,dst=/validation/communication,readonly \
            -e AONOHAKO_TEST_DURANTE=1 -e AONOHAKO_ENFORCE_SANDBOX_TESTS=1 \
            -e AONOHAKO_WORK_ROOT=/work \
            -e AONOHAKO_COMPETITIVE_RUNTIME_FINGERPRINT="$image_id" \
            -e AONOHAKO_TEST_DURANTE_INTERACTIVE=/validation/interactive \
            -e AONOHAKO_TEST_DURANTE_COMMUNICATION=/validation/communication \
            --entrypoint /validation/execute.test "$image_id" \
            -test.v -test.run '^TestDurante(Interactive|Communication)Integration$' -test.timeout 240s
