      script:
        - export UIUA_VERSION=0.18.1
        - curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "https://github.com/uiua-lang/uiua/releases/download/${UIUA_VERSION}/uiua-bin-x86_64-unknown-linux-gnu-no-audio.zip" -o /tmp/uiua.zip
        - unzip -q /tmp/uiua.zip -d /usr/local/bin
        - chmod 0755 /usr/local/bin/uiua
        - rm -f /tmp/uiua.zip
    smoke:
      command:
        - bash
        - -lc
        - |
          printf '%s\n' '&p "ok"' > Main.ua
          uiua run Main.ua --no-format | grep '^ok$'

  janet:
    install:
      apt:
        - curl
      script:
        - export JANET_VERSION=1.41.2
        - curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "https://github.com/janet-lang/janet/releases/download/v${JANET_VERSION}/janet-v${JANET_VERSION}-linux-x64.tar.gz" -o /tmp/janet.tar.gz
        - mkdir -p /opt/janet
        - tar -xzf /tmp/janet.tar.gz -C /opt/janet --strip-components=1
        - export JANET_BIN="$(find /opt/janet -type f -name janet | head -n1)"
        - test -n "${JANET_BIN}" && ln -sfn "${JANET_BIN}" /usr/local/bin/janet
        - rm -f /tmp/janet.tar.gz
    smoke:
      command:
        - bash
        - -lc
        - |
          printf '%s\n' '(print "ok")' > Main.janet
          janet Main.janet | grep '^ok$'

  sed:
    install:
      apt:
        - sed
    smoke:
      command:
        - bash
        - -lc
        - |
          printf '%s\n' 's/^/ok/' > Main.sed
          printf '%s\n' '' | sed -f Main.sed | grep '^ok$'

  bc:
    install:
      apt:
        - bc
    smoke:
      command:
        - bash
        - -lc
        - |
          printf '%s\n' '1 + 1' > Main.bc
          bc -q Main.bc | grep '^2$'

  forth:
    install:
      shared:
        - gforth
    smoke:
      command:
        - bash
        - -lc
        - |
          printf '%s\n' '." ok" cr' > Main.fs
          gforth Main.fs -e bye | grep '^ok$'

  gforth:
    install:
      shared:
        - gforth
    smoke:
      command:
        - bash
        - -lc
        - |
          printf '%s\n' '." ok" cr' > Main.fs
          gforth Main.fs -e bye | grep '^ok$'

  uhmlang:
    install:
      apt:
        - git
      script:
        - ln -sfn /usr/local/go/bin/go /usr/local/bin/go
        - ln -sfn /usr/local/go/bin/gofmt /usr/local/bin/gofmt
        - git clone --depth=1 https://github.com/rycont/umjunsik-lang.git /tmp/umjunsik-lang
        # Upstream uses Scanln for 식?, which cannot consume BOJ-style same-line integer input like "5 1".
        - sed -i 's/fmt.Scanln(&integer)/fmt.Scan(\&integer)/' /tmp/umjunsik-lang/umjunsik-lang-go/eval/eval.go
        - grep -q 'fmt.Scan(&integer)' /tmp/umjunsik-lang/umjunsik-lang-go/eval/eval.go
        - cd /tmp/umjunsik-lang/umjunsik-lang-go && env -u GOROOT GOENV=off go build -o /usr/local/bin/umjunsik-lang-go .
        - ln -sfn /usr/local/bin/umjunsik-lang-go /usr/bin/umjunsik-lang-go
        - rm -rf /tmp/umjunsik-lang
    smoke:
      command:
        - bash
        - -lc
        - |
          printf '%s\n' '어떻게' '식........... ........ㅋ' '이 사람이름이냐ㅋㅋ' > Main.uhm
          /usr/bin/umjunsik-lang-go Main.uhm | grep '^X$'
          printf '%s\n' '어떻게' '' '엄식?' '어엄식?' '' '동탄어?준... ....' '' '엄어,' '어엄어어.' '' '준.. ...' '식어어!' '' '이 사람이름이냐ㅋㅋ' > Main.uhm
          printf '5 1\n' | /usr/bin/umjunsik-lang-go Main.uhm | grep '^6$'

