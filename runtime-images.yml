  fennel:
    install:
      apt:
        - curl
        - lua5.4
      sandbox_tools:
        - fennel
        - lua
        - lua5.4
        - luac5.4
      script:
        - export FENNEL_VERSION=1.6.1
        - export FENNEL_SHA256=3abde50a0e25270cbb8f9d183a0a42221875b3390ba4bf11ef8697eaa53b2787
        - curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "https://fennel-lang.org/downloads/fennel-${FENNEL_VERSION}-x86_64" -o /usr/local/bin/fennel
        - echo "${FENNEL_SHA256}  /usr/local/bin/fennel" | sha256sum -c -
        - chmod 0755 /usr/local/bin/fennel
    smoke:
      command:
        - bash
        - -lc
        - |
          set -euo pipefail
          cat > Main.fnl <<'FENNEL'
          (when os.execute (os.execute "touch /tmp/fennel-exec-leak"))
          (local (debug-ok _) (pcall require :debug))
          (local line (io.read))
          (local (a b) (line:match "(%-?%d+)%s+(%-?%d+)"))
          (print (if debug-ok "debug:leaked" "debug:blocked"))
          (print (+ (tonumber a) (tonumber b)))
          FENNEL
          aonohako-fennel-compile Main.fnl Main.lua
          luac5.4 -p -- Main.lua
          printf '2 3\n' | lua5.4 Main.lua | grep -Fx 'debug:blocked'
          printf '2 3\n' | lua5.4 Main.lua | grep -Fx '5'
          test ! -e /tmp/fennel-exec-leak

          cat > CompilerPrint.fnl <<'FENNEL'
          (eval-compiler (print :compiler-diagnostic))
          (print :runtime-ok)
          FENNEL
          aonohako-fennel-compile CompilerPrint.fnl CompilerPrint.lua > CompilerPrint.stdout 2> CompilerPrint.stderr
          test ! -s CompilerPrint.stdout
          grep -Fx 'compiler-diagnostic' CompilerPrint.stderr
          lua5.4 CompilerPrint.lua | grep -Fx 'runtime-ok'

          cat > InvalidLua.fnl <<'FENNEL'
          (lua "this is not valid Lua!")
          FENNEL
          if aonohako-fennel-compile InvalidLua.fnl InvalidLua.lua >/dev/null 2>&1; then exit 1; fi
          test ! -e InvalidLua.lua

          cat > mathmod.fnl <<'FENNEL'
          {:sum (fn [a b] (+ a b))}
          FENNEL
          cat > Include.fnl <<'FENNEL'
          (local mathmod (require :mathmod))
          (print (mathmod.sum 2 3))
          FENNEL
          aonohako-fennel-compile Include.fnl Include.lua
          lua5.4 Include.lua | grep -Fx '5'

          mkdir -p native
          cat > NativeLeak.c <<'C'
          #include <stdio.h>
          typedef struct lua_State lua_State;
          __attribute__((constructor)) static void leak(void) {
            FILE *file = fopen("/tmp/fennel-native-leak", "w");
            if (file != NULL) {
              fputs("leaked", file);
              fclose(file);
            }
          }
          int luaopen_nativeleak(lua_State *state) { (void)state; return 0; }
          int luaopen_native_leak(lua_State *state) { (void)state; return 0; }
          C
          cc -shared -fPIC -o nativeleak.so NativeLeak.c
          cp nativeleak.so native/leak.so
          cat > NativeRequire.fnl <<'FENNEL'
          (local searchers-blocked
            (and (= nil (. package.searchers 3))
                 (= nil (. package.searchers 4))))
          (local loaders-blocked
            (or (= nil package.loaders)
                (and (= nil (. package.loaders 3))
                     (= nil (. package.loaders 4)))))
          (local entry-points-blocked
            (and (= nil package.loadlib)
                 (= "" package.cpath)
                 (= nil (next package.preload))))
          (print (if (and searchers-blocked loaders-blocked entry-points-blocked)
                   "loaders:blocked"
                   "loaders:leaked"))
          (set package.cpath "./?.so;./?/?.so")
          (local (exact-ok _) (pcall require :nativeleak))
          (local (dotted-ok _) (pcall require :native.leak))
          (print (if exact-ok "exact:leaked" "exact:blocked"))
          (print (if dotted-ok "dotted:leaked" "dotted:blocked"))
          FENNEL
          aonohako-fennel-compile NativeRequire.fnl NativeRequire.lua
          lua5.4 NativeRequire.lua | grep -Fx 'loaders:blocked'
          lua5.4 NativeRequire.lua | grep -Fx 'exact:blocked'
          lua5.4 NativeRequire.lua | grep -Fx 'dotted:blocked'
          test ! -e /tmp/fennel-native-leak

          mkdir -p signal-bin
          cat > signal-bin/fennel <<'SH'
          #!/bin/sh
          : > /tmp/fennel-signal-ready
          while :; do sleep 1; done
          SH
          chmod 0755 signal-bin/fennel
          printf '%s\n' '(print :unreachable)' > Signal.fnl
          rm -f /tmp/fennel-signal-ready
          set +e
          setsid env PATH="${PWD}/signal-bin:${PATH}" aonohako-fennel-compile Signal.fnl Signal.lua &
          signal_pid=$!
          attempt=0
          while [ ! -e /tmp/fennel-signal-ready ]; do
            attempt=$((attempt + 1))
            if [ "${attempt}" -ge 100 ]; then kill -KILL -- "-${signal_pid}"; exit 1; fi
            sleep 0.01
          done
          kill -TERM -- "-${signal_pid}"
          wait "${signal_pid}"
          signal_status=$?
          set -e
          test "${signal_status}" -eq 143
          test ! -e Signal.lua
          test -z "$(find . -maxdepth 1 -type d -name '.aonohako-fennel.*' -print -quit)"

          printf '%s\n' '(local broken' > Broken.fnl
          if aonohako-fennel-compile Broken.fnl Broken.lua >/dev/null 2>&1; then exit 1; fi

  chapel:
    install:
      apt:
        - clang
        - curl
        - gcc
        - git
        - libclang-cpp-dev
        - libclang-dev
        - libgmp-dev
        - libhwloc-dev
        - libunwind-dev
        - llvm
        - llvm-dev
        - make
        - pkgconf
        - python3
        - python3-dev
        - python3-venv
      sandbox_tools:
        - chpl
      script:
        - export CHAPEL_VERSION=2.9.0
        - export CHAPEL_DEB_SHA256=11f93de9e725a7c74608b4afcc7c8fc8bec380f27b09883cd6f69d6fbe66e13d
        - curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "https://github.com/chapel-lang/chapel/releases/download/${CHAPEL_VERSION}/chapel-${CHAPEL_VERSION}-1.debian13.amd64.deb" -o /tmp/chapel.deb
        - echo "${CHAPEL_DEB_SHA256}  /tmp/chapel.deb" | sha256sum -c -
        - dpkg -i /tmp/chapel.deb
        - rm -f /tmp/chapel.deb
        - for tool in c2chapel chpl-language-server chpl-shim chplcheck chpldoc mason; do if command -v "${tool}" >/dev/null 2>&1; then chmod 0750 "$(command -v "${tool}")"; fi; done
        - chmod 0750 /usr/share/chapel/2.9/tools/c2chapel/c2chapel.py /usr/share/chapel/2.9/tools/c2chapel/c2chapel /usr/share/chapel/2.9/tools/chpl-language-server/chpl-language-server /usr/share/chapel/2.9/tools/chpl-language-server/src/chpl-shim.py /usr/share/chapel/2.9/tools/chpl-language-server/chpl-shim /usr/share/chapel/2.9/tools/chplcheck/chplcheck
        - test "$(find /usr/lib/chapel/2.9/third-party/chpl-venv -type f -perm /0111 | wc -l)" -eq 37
        - find /usr/lib/chapel/2.9/third-party/chpl-venv -type f -perm /0111 -exec chmod 0750 {} +
        - chmod 0750 /usr/share/chapel/2.9/modules/dists/fixDistDocs.perl /usr/share/chapel/2.9/modules/internal/fixInternalDocs.sh
        - test -d /usr/lib/chapel/2.9/third-party
        - find /usr/lib/chapel/2.9/third-party -path '*/bin/*' -type f -perm /0111 -exec chmod 0750 {} +
    smoke:
      command:
        - bash
        - -lc
        - |
          set -euo pipefail
          cat > Main.chpl <<'CHAPEL'
          use IO;
          var a, b: int;
          read(a, b);
          writeln(a + b);
          writeln(numLocales, " ", here.maxTaskPar);
          CHAPEL
          for path in /usr/share/chapel/2.9/tools/c2chapel/c2chapel.py /usr/share/chapel/2.9/tools/c2chapel/c2chapel /usr/share/chapel/2.9/tools/chpl-language-server/chpl-language-server /usr/share/chapel/2.9/tools/chpl-language-server/src/chpl-shim.py /usr/share/chapel/2.9/tools/chpl-language-server/chpl-shim /usr/share/chapel/2.9/tools/chplcheck/chplcheck /usr/share/chapel/2.9/modules/dists/fixDistDocs.perl /usr/share/chapel/2.9/modules/internal/fixInternalDocs.sh; do test "$(stat -c %a "${path}")" = 750; done
          test "$(find /usr/lib/chapel/2.9/third-party/chpl-venv -type f -perm /0111 | wc -l)" -eq 37
          if find /usr/lib/chapel/2.9/third-party/chpl-venv -type f -perm /0111 -perm /0005 -print -quit | grep -q .; then exit 1; fi
          test -d /usr/lib/chapel/2.9/third-party
          if find /usr/lib/chapel/2.9/third-party -path '*/bin/*' -type l -print -quit | grep -q .; then exit 1; fi
          if find /usr/lib/chapel/2.9/third-party -path '*/bin/*' -type f -perm /0001 -print -quit | grep -q .; then exit 1; fi
          CHPL_COMM=none CHPL_TASKS=qthreads CHPL_TARGET_CPU=none chpl --local --fast -o Main Main.chpl
          test -x Main
          output="$(printf '2 3\n' | CHPL_RT_NUM_THREADS_PER_LOCALE=1 ./Main -nl 1)"
          test "${output}" = "$(printf '5\n1 1')"
          if CHPL_RT_NUM_THREADS_PER_LOCALE=1 ./Main -nl 2 >/dev/null 2>&1; then exit 1; fi
          printf '%s\n' 'proc main( {' > Broken.chpl
          rm -f Broken
          if CHPL_COMM=none CHPL_TASKS=qthreads CHPL_TARGET_CPU=none chpl --local --fast -o Broken Broken.chpl >/dev/null 2>&1; then exit 1; fi
          test ! -e Broken

  algol68:
    install:
      apt:
        - curl
        - gcc
        - libc6-dev
        - make
      sandbox_tools:
        - a68g
      script:
        - export A68G_VERSION=3.13.3
        - export A68G_SHA256=78dc53f4a712a9c8ee159b1eb7045fe4ea060c4eb2a49efb9634f83c2cb13995
        - export A68G_SHA512=90b64911ee3b4011799425cf846fea4a26570182ec1ed9f65e6f0630e02b0623ed408fb6d074dcd2795b6412e209a39f5580d32acd079a3f3d419bf2440512a6
        - curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "https://src.fedoraproject.org/repo/pkgs/algol68g/algol68g-${A68G_VERSION}.tar.gz/sha512/${A68G_SHA512}/algol68g-${A68G_VERSION}.tar.gz" -o /tmp/algol68g.tar.gz
        - echo "${A68G_SHA256}  /tmp/algol68g.tar.gz" | sha256sum -c -
        - rm -rf /tmp/algol68g-src
        - mkdir -p /tmp/algol68g-src
        - tar -xzf /tmp/algol68g.tar.gz -C /tmp/algol68g-src --strip-components=1
        - |
          source_root=/tmp/algol68g-src
          header="${source_root}/src/include/a68g.h"
          driver="${source_root}/src/a68g/a68g.c"
          prelude="${source_root}/src/a68g/prelude.c"
          monitor="${source_root}/src/a68g/genie-monitor.c"

          test "$(grep -Fxc '#include "a68g-includes.h"' "${header}")" -eq 1
          sed -i '/^#include "a68g-includes.h"$/a\
          \
          #if defined (AONOHAKO_SAFE_RUNTIME)\
            static inline int aonohako_disabled_system (const char *command) {\
              (void) command;\
              errno = EPERM;\
              return -1;\
            }\
            static inline pid_t aonohako_disabled_fork (void) {\
              errno = EPERM;\
              return (pid_t) -1;\
            }\
            static inline int aonohako_disabled_execve (const char *path, char *const argv[], char *const envp[]) {\
              (void) path;\
              (void) argv;\
              (void) envp;\
              errno = EPERM;\
              return -1;\
            }\
            #define system(command) aonohako_disabled_system (command)\
            #define fork() aonohako_disabled_fork ()\
            #define execve(path, argv, envp) aonohako_disabled_execve (path, argv, envp)\
          #endif' "${header}"
          test "$(grep -Fxc '  static inline int aonohako_disabled_system (const char *command) {' "${header}")" -eq 1
          test "$(grep -Fxc '  static inline pid_t aonohako_disabled_fork (void) {' "${header}")" -eq 1
          test "$(grep -Fxc '  static inline int aonohako_disabled_execve (const char *path, char *const argv[], char *const envp[]) {' "${header}")" -eq 1
          test "$(grep -Fxc '  #define system(command) aonohako_disabled_system (command)' "${header}")" -eq 1
          test "$(grep -Fxc '  #define fork() aonohako_disabled_fork ()' "${header}")" -eq 1
          test "$(grep -Fxc '  #define execve(path, argv, envp) aonohako_disabled_execve (path, argv, envp)' "${header}")" -eq 1

          test "$(grep -Fxc '    read_rc_options ();' "${driver}")" -eq 1
          rc_line="$(grep -Fn '    read_rc_options ();' "${driver}")"
          sed -i "${rc_line%%:*}c\\    (void) 0; // Aonohako ignores untrusted cwd options." "${driver}"
          test "$(grep -Fxc '    (void) 0; // Aonohako ignores untrusted cwd options.' "${driver}")" -eq 1

          test "$(grep -Fxc '    read_env_options ();' "${driver}")" -eq 1
          env_line="$(grep -Fn '    read_env_options ();' "${driver}")"
          sed -i "${env_line%%:*}c\\    (void) 0; // Aonohako ignores ambient process options." "${driver}"
          test "$(grep -Fxc '    (void) 0; // Aonohako ignores ambient process options.' "${driver}")" -eq 1

          remove_registration() {
            local registration="$1"
            local match
            test "$(grep -Fxc "${registration}" "${prelude}")" -eq 1
            match="$(grep -Fn "${registration}" "${prelude}")"
            sed -i "${match%%:*}d" "${prelude}"
          }
          remove_registration '  a68g_idf (A68G_EXT, "break", A68G_MCACHE (proc_void), genie_break);'
          remove_registration '  a68g_idf (A68G_EXT, "debug", A68G_MCACHE (proc_void), genie_debug);'
          remove_registration '  a68g_idf (A68G_EXT, "monitor", A68G_MCACHE (proc_void), genie_debug);'
          remove_registration '  a68g_idf (A68G_EXT, "system", m, genie_system);'
          remove_registration '  a68g_idf (A68G_EXT, "fork", m, genie_fork);'
          remove_registration '  a68g_idf (A68G_EXT, "exec", m, genie_exec);'
          remove_registration '  a68g_idf (A68G_EXT, "execve", m, genie_exec);'
          remove_registration '  a68g_idf (A68G_EXT, "execsub", m, genie_exec_sub);'
          remove_registration '  a68g_idf (A68G_EXT, "execvechild", m, genie_exec_sub);'
          remove_registration '  a68g_idf (A68G_EXT, "execsubpipeline", m, genie_exec_sub_pipeline);'
          remove_registration '  a68g_idf (A68G_EXT, "execvechildpipe", m, genie_exec_sub_pipeline);'
          remove_registration '  a68g_idf (A68G_EXT, "execsuboutput", m, genie_exec_sub_output);'
          remove_registration '  a68g_idf (A68G_EXT, "execveoutput", m, genie_exec_sub_output);'

          monitor_call='      ASSERT (a68g_bufprt (A68G (output_line), SNPRINTF_SIZE, "return code %d", system (sym)) >= 0);'
          test "$(grep -Fxc "${monitor_call}" "${monitor}")" -eq 1
          monitor_line="$(grep -Fn "${monitor_call}" "${monitor}")"
          sed -i "${monitor_line%%:*}c\\      monitor_error (\"process execution is disabled\", NO_TEXT);" "${monitor}"
          test "$(grep -Fxc '      monitor_error ("process execution is disabled", NO_TEXT);' "${monitor}")" -eq 1
        - (cd /tmp/algol68g-src && CPPFLAGS=-DAONOHAKO_SAFE_RUNTIME=1 ./configure --enable-core --prefix=/usr/local)
        - make -C /tmp/algol68g-src -j1
        - make -C /tmp/algol68g-src install
        - test "$(nm -D --undefined-only /usr/local/bin/a68g | grep -Ec '[[:space:]](system|fork|execve|dlopen|dlsym)(@|$)' || true)" -eq 0
        - strip /usr/local/bin/a68g
        - rm -rf /tmp/algol68g-src /tmp/algol68g.tar.gz
    smoke:
      command:
        - bash
        - -lc
        - |
          set -euo pipefail
          a68g --version | grep '3.13.3'
          test "$(nm -D --undefined-only "$(command -v a68g)" | grep -Ec '[[:space:]](system|fork|execve|dlopen|dlsym)(@|$)' || true)" -eq 0

          cat > Main.a68 <<'ALGOL68'
          BEGIN
            INT a, b;
            read ((a, b));
            printf (($g(0)l$, a + b))
          END
          ALGOL68
          printf '%s\n' '-O1 --compile --debug' > .a68grc
          A68G_OPTIONS='-O1 --compile --debug' a68g --quiet --no-compile -O0 --check --file Main.a68 --no-pragmats
          output="$(printf '2 3\n' | A68G_OPTIONS='-O1 --compile --debug' a68g --quiet --no-compile -O0 --run --file Main.a68 --no-pragmats)"
          test "${output}" = 5
          test -z "$(find . -maxdepth 1 -type f \( -name 'Main.c' -o -name 'Main.so' -o -name 'Main.o' -o -name 'Main.sh' -o -name 'Main.lst' \) -print -quit)"

          cat > Pragmat.a68 <<'ALGOL68'
          PR COMPILE PR
          BEGIN print (("pragmat ignored", new line)) END
          ALGOL68
          if A68G_OPTIONS='-O1 --compile --debug' a68g --quiet --no-compile -O0 --run --file Pragmat.a68 --no-pragmats >/dev/null 2>&1; then exit 1; fi
          test -z "$(find . -maxdepth 1 -type f -name 'Pragmat.*' ! -name 'Pragmat.a68' -print -quit)"

          cat > Process.a68 <<'ALGOL68'
          BEGIN print ((system ("touch /tmp/a68g-system-leak"), new line)) END
          ALGOL68
          rm -f /tmp/a68g-system-leak
          if A68G_OPTIONS='-O1 --compile --debug' a68g --quiet --no-compile -O0 --run --file Process.a68 --no-pragmats >/dev/null 2>&1; then exit 1; fi
          test ! -e /tmp/a68g-system-leak

          cat > ProcessFork.a68 <<'ALGOL68'
          BEGIN print ((fork, new line)) END
          ALGOL68
          if a68g --quiet --no-compile -O0 --run --file ProcessFork.a68 --no-pragmats >fork.out 2>&1; then exit 1; fi
          grep -F 'tag "fork" has not been declared properly' fork.out

          cat > ProcessExec.a68 <<'ALGOL68'
          BEGIN print ((exec ("/usr/bin/touch", "/tmp/a68g-exec-leak"), new line)) END
          ALGOL68
          rm -f /tmp/a68g-exec-leak
          if a68g --quiet --no-compile -O0 --run --file ProcessExec.a68 --no-pragmats >exec.out 2>&1; then exit 1; fi
          grep -F 'tag "exec" has not been declared properly' exec.out
          test ! -e /tmp/a68g-exec-leak

          cat > Monitor.a68 <<'ALGOL68'
          BEGIN INT zero = 0; print ((1 OVER zero, new line)) END
          ALGOL68
          rm -f /tmp/a68g-monitor-leak
          printf '%s\n' 'DO touch /tmp/a68g-monitor-leak' 'QUIT' 'Y' |
            timeout 3 a68g --debug --no-compile -O0 --run --file Monitor.a68 --no-pragmats >monitor.out 2>&1
          grep -F 'process execution is disabled' monitor.out
          test ! -e /tmp/a68g-monitor-leak

          printf '%s\n' 'BEGIN print ((' > Broken.a68
          if A68G_OPTIONS='-O1 --compile --debug' a68g --quiet --no-compile -O0 --check --file Broken.a68 --no-pragmats >/dev/null 2>&1; then exit 1; fi

  koka:
    install:
      apt:
        - binutils
        - curl
        - libgmp10
        - zlib1g
      sandbox_tools:
        - koka
      script:
        - export KOKA_VERSION=3.2.3
        - export KOKA_SHA256=e82a4b497f1f8791ee171d06c45293ba16432e485d645ddd9688bafa6ccde5a5
        - curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "https://github.com/koka-lang/koka/releases/download/v${KOKA_VERSION}/koka-v${KOKA_VERSION}-linux-x64.tar.gz" -o /tmp/koka.tar.gz
        - echo "${KOKA_SHA256}  /tmp/koka.tar.gz" | sha256sum -c -
        - rm -rf /opt/koka
        - install -d -m 0755 /opt/koka
        - tar -xzf /tmp/koka.tar.gz -C /opt/koka
        - test "$(cat /opt/koka/meta/version)" = "v${KOKA_VERSION}"
        - test -x /opt/koka/bin/koka
        - chown -R root:root /opt/koka
        - find /opt/koka -type d -exec chmod 0755 {} +
        - find /opt/koka -type f -exec chmod 0644 {} +
        - chmod 0755 /opt/koka/bin/koka
        - ln -sfn /opt/koka/bin/koka /usr/local/bin/koka
        - rm -f /tmp/koka.tar.gz
    smoke:
      command:
        - bash
        - -lc
        - |
          set -euo pipefail
          koka --version 2>&1 | grep -F 'version: 3.2.3'
          test "$(cat /opt/koka/meta/version)" = v3.2.3
          test "$(stat -c '%u:%g:%a' /opt/koka/bin/koka)" = '0:0:755'
          if find /opt/koka -type d -perm /0022 -print -quit | grep -q .; then exit 1; fi
          if find /opt/koka -type f -perm /0022 -print -quit | grep -q .; then exit 1; fi
          test "$(find /opt/koka -type f -perm /0111 | wc -l)" -eq 1
          ! command -v conan >/dev/null 2>&1
          ! command -v vcpkg >/dev/null 2>&1

          cat > main.kk <<'KOKA'
          fun main()
            println("Hello, World!")
          KOKA
          koka --compile -O2 --no-debug -j1 -v0 --console=raw --no-autoinstall --cc=/usr/bin/gcc-16 '--ccopts=-march=x86-64 -mtune=generic' '--cclinkopts=-march=x86-64 -mtune=generic' --builddir=.aonohako-koka-build --output=Main main.kk
          test "$(stat -c %a Main)" = 644
          chmod 0755 Main
          test -x Main
          readelf -n Main | grep -F 'x86 ISA needed: x86-64-baseline'
          if readelf -d Main | grep -Eq '\((RPATH|RUNPATH)\)'; then exit 1; fi
          if readelf -d Main | grep -E 'Shared library: \[[^]]*[/\\]' >/dev/null; then exit 1; fi
          readelf -d Main | grep -F 'Shared library: [libm.so.6]'
          readelf -d Main | grep -F 'Shared library: [libc.so.6]'
          ./Main | grep -Fx 'Hello, World!'

          install -d -m 0755 /tmp/aonohako-koka-evil
          printf '%s\n' 'void marker(void) {}' > /tmp/aonohako-koka-evil/evil.c
          /usr/bin/gcc-16 -shared -fPIC -Wl,-soname,evil/libevil.so -o /tmp/aonohako-koka-evil/libevil.so /tmp/aonohako-koka-evil/evil.c
          cat > injected.kk <<'KOKA'
          extern import {
            c {
              header-include-inline="void marker(void);"
              syslib=":../../tmp/aonohako-koka-evil/libevil.so"
            }
          }
          extern marker() : io () {
            c "marker"
          }
          fun main()
            marker()
          KOKA
          koka --compile -O2 --no-debug -j1 -v0 --console=raw --no-autoinstall --cc=/usr/bin/gcc-16 '--ccopts=-march=x86-64 -mtune=generic' '--cclinkopts=-march=x86-64 -mtune=generic' --builddir=.aonohako-koka-injected --output=Injected injected.kk
          readelf -d Injected | grep -F 'Shared library: [evil/libevil.so]'

          printf '%s\n' 'fun main(' > main.kk
          rm -f Broken
          if koka --compile -O2 --no-debug -j1 -v0 --console=raw --no-autoinstall --cc=/usr/bin/gcc-16 '--ccopts=-march=x86-64 -mtune=generic' '--cclinkopts=-march=x86-64 -mtune=generic' --builddir=.aonohako-koka-broken --output=Broken main.kk >/dev/null 2>&1; then exit 1; fi
          test ! -e Broken

  pony:
    install:
      apt:
        - curl
        - libc6-dev
        - libgcc-14-dev
        - zlib1g
      sandbox_tools:
        - ponyc
      script:
        - export PONY_VERSION=0.69.1
        - export PONY_ARCHIVE_ROOT=0.69.1-38f9f11
        - export PONY_SHA256=8e1955ed1a63444ae13666031d5d3909cacfb475ca96643e878f36cf4edff9ab
        - curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "https://github.com/ponylang/ponyc/releases/download/${PONY_VERSION}/ponyc-x86-64-unknown-linux-ubuntu24.04.tar.gz" -o /tmp/ponyc.tar.gz
        - echo "${PONY_SHA256}  /tmp/ponyc.tar.gz" | sha256sum -c -
        - rm -rf /opt/pony
        - install -d -m 0755 /opt/pony
        - tar -xzf /tmp/ponyc.tar.gz -C /opt/pony --strip-components=1 "${PONY_ARCHIVE_ROOT}/bin/ponyc" "${PONY_ARCHIVE_ROOT}/packages" "${PONY_ARCHIVE_ROOT}/lib/x86-64/libponyrt-pic.a" "${PONY_ARCHIVE_ROOT}/lib/x86-64/crtbeginS.o" "${PONY_ARCHIVE_ROOT}/lib/x86-64/crtendS.o"
        - chown -R root:root /opt/pony
        - find /opt/pony -type d -exec chmod 0755 {} +
        - find /opt/pony -type f -exec chmod 0644 {} +
        - chmod 0755 /opt/pony/bin/ponyc
        - ln -sfn /opt/pony/bin/ponyc /usr/local/bin/ponyc
        - for tool in /usr/bin/gencat /usr/bin/rpcgen; do if [[ -e "${tool}" ]]; then chmod 0750 "${tool}"; fi; done
        - rm -f /tmp/ponyc.tar.gz
    smoke:
      command:
        - bash
        - -lc
        - |
          set -euo pipefail
          ponyc --version 2>&1 | grep -F '0.69.1'
          test "$(stat -c '%u:%g:%a' /opt/pony/bin/ponyc)" = '0:0:755'
          test "$(find /opt/pony -type f -perm /0111 | wc -l)" -eq 1
          test ! -e /opt/pony/bin/pony-doc
          test ! -e /opt/pony/bin/pony-lint
          test ! -e /opt/pony/bin/pony-lsp
          if [[ -e /usr/bin/gencat ]] && find /usr/bin/gencat -perm /0001 -print -quit | grep -q .; then exit 1; fi
          if [[ -e /usr/bin/rpcgen ]] && find /usr/bin/rpcgen -perm /0001 -print -quit | grep -q .; then exit 1; fi
          if ldd /opt/pony/bin/ponyc | grep -F 'not found'; then exit 1; fi

          (
          install -d -m 0755 /tmp/aonohako-pony-smoke
          cd /tmp/aonohako-pony-smoke
          cat > main.pony <<'PONY'
          actor Main
            new create(env: Env) =>
              env.out.print("Hello, World!")
          PONY
          ponyc --cpu=generic --output=. --bin-name=Main .
          test -x Main
          readelf -h Main | grep -F 'Type:' | grep -F 'DYN'
          if objdump -d Main | grep -E '(%(ymm|zmm)[0-9]+|[[:space:]]v[a-z0-9]+[[:space:]])'; then exit 1; fi
          readelf -W -l Main | grep -F 'GNU_STACK' | grep -F 'RW '
          if readelf -W -l Main | grep -F 'GNU_STACK' | grep -F 'RWE'; then exit 1; fi
          readelf -W -l Main | grep -F 'GNU_RELRO'
          ./Main --ponymaxthreads=1 | grep -Fx 'Hello, World!'

          printf '%s\n' 'actor Main' '  new create(env: Env) =>' '    env.out.print(' > broken.pony
          rm -f Broken
          if ponyc --cpu=generic --output=. --bin-name=Broken . >/dev/null 2>&1; then exit 1; fi
          test ! -e Broken
          )

  bash:
    install:
      shared:
        - shell_runtime
    smoke:
      command:
        - /bin/bash
        - --noprofile
        - --norc
        - -c
        - |
          set -euo pipefail
          test "$(dpkg-query -W -f='${Version}' bash)" = 5.2.37-2+b9
          test "$(dpkg-query -W -f='${Version}' dash)" = 0.5.12-12
          rm -f /tmp/aonohako-shell-syntax-leak
          printf '%s\n' 'value=$(touch /tmp/aonohako-shell-syntax-leak)' > SyntaxOnly.sh
          bash --noprofile --norc -n SyntaxOnly.sh
          test ! -e /tmp/aonohako-shell-syntax-leak
          printf '%s\n' 'if then' > Broken.sh
          if bash --noprofile --norc -n Broken.sh >/dev/null 2>&1; then exit 1; fi

  posix-sh:
    install:
      shared:
        - shell_runtime
    smoke:
      command:
        - /bin/dash
        - -c
        - |
          set -eu
          test "$(dpkg-query -W -f='${Version}' bash)" = 5.2.37-2+b9
          test "$(dpkg-query -W -f='${Version}' dash)" = 0.5.12-12
          rm -f /tmp/aonohako-posix-shell-syntax-leak
          printf '%s\n' 'value=$(touch /tmp/aonohako-posix-shell-syntax-leak)' > SyntaxOnly.sh
          /bin/dash -n SyntaxOnly.sh
          test ! -e /tmp/aonohako-posix-shell-syntax-leak
          printf '%s\n' 'if then' > Broken.sh
          if /bin/dash -n Broken.sh >/dev/null 2>&1; then exit 1; fi

  zsh:
    install:
      shared:
        - shell_runtime
    smoke:
      command:
        - /usr/bin/zsh
        - -d
        - -f
        - -c
        - |
          set -eu
          test "$(dpkg-query -W -f='${Version}' zsh)" = 5.9-8+b23
          test "$(dpkg-query -W -f='${Version}' zsh-common)" = 5.9-8
          startup_root=/tmp/aonohako-zsh-startup
          startup_leak=/tmp/aonohako-zsh-startup-leak
          rm -rf "${startup_root}" "${startup_leak}"
          mkdir -p "${startup_root}"
          printf '%s\n' "touch ${startup_leak}" > "${startup_root}/.zshenv"
          ZDOTDIR="${startup_root}" HOME="${startup_root}" /usr/bin/zsh -d -f -c ':'
          test ! -e "${startup_leak}"
          printf '%s\n' 'read -r a b' 'print -r -- $((a + b))' > Main.zsh
          test "$(printf '1 2\n' | /usr/bin/zsh -d -f Main.zsh)" = 3
          rm -f /tmp/aonohako-zsh-syntax-leak
          printf '%s\n' 'value=$(touch /tmp/aonohako-zsh-syntax-leak)' > SyntaxOnly.zsh
          /usr/bin/zsh -d -f -n SyntaxOnly.zsh
          test ! -e /tmp/aonohako-zsh-syntax-leak
          printf '%s\n' 'if true; then' > Broken.zsh
          if /usr/bin/zsh -d -f -n Broken.zsh >/dev/null 2>&1; then exit 1; fi

  fish:
    install:
      shared:
        - shell_runtime
    smoke:
      command:
        - /usr/bin/fish
        - --no-config
        - --private
        - -c
        - |
          test (dpkg-query -W -f='${Version}' fish) = 4.0.2-1; or exit 1
          test (dpkg-query -W -f='${Version}' fish-common) = 4.0.2-1; or exit 1
          set startup_root /tmp/aonohako-fish-startup
          set startup_leak /tmp/aonohako-fish-startup-leak
          rm -rf "$startup_root" "$startup_leak"; or exit 1
          mkdir -p "$startup_root/fish"; or exit 1
          printf '%s\n' "touch $startup_leak" > "$startup_root/fish/config.fish"; or exit 1
          env XDG_CONFIG_HOME="$startup_root" HOME="$startup_root" /usr/bin/fish --no-config --private -c ':'; or exit 1
          test ! -e "$startup_leak"; or exit 1
          printf '%s\n' 'read -l a b' 'math "$a + $b"' > Main.fish; or exit 1
          test (printf '1 2\n' | /usr/bin/fish --no-config --private Main.fish) = 3; or exit 1
          rm -f /tmp/aonohako-fish-syntax-leak; or exit 1
          printf '%s\n' 'set value (touch /tmp/aonohako-fish-syntax-leak)' > SyntaxOnly.fish; or exit 1
          /usr/bin/fish --no-config --private --no-execute SyntaxOnly.fish; or exit 1
          test ! -e /tmp/aonohako-fish-syntax-leak; or exit 1
          printf '%s\n' 'if true' > Broken.fish; or exit 1
          if /usr/bin/fish --no-config --private --no-execute Broken.fish >/dev/null 2>&1
              exit 1
          end

  powershell:
    install:
      apt:
        - curl
        - libicu76
      sandbox_tools:
        - pwsh
      script:
        - export POWERSHELL_VERSION=7.6.5
        - export POWERSHELL_SHA256=b34ab3b19acac1d3d4d0d3cfdb02acf62f457b0b6a962ff008132033f7566844
        - curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v${POWERSHELL_VERSION}/powershell-${POWERSHELL_VERSION}-linux-x64.tar.gz" -o /tmp/powershell.tar.gz
        - echo "${POWERSHELL_SHA256}  /tmp/powershell.tar.gz" | sha256sum -c -
        - rm -rf /opt/microsoft/powershell/7
        - install -d -m 0755 /opt/microsoft/powershell/7
        - tar -xzf /tmp/powershell.tar.gz -C /opt/microsoft/powershell/7
        - rm -f /opt/microsoft/powershell/7/createdump
        - chown -R root:root /opt/microsoft/powershell/7
        - find /opt/microsoft/powershell/7 -type d -exec chmod 0755 {} +
        - find /opt/microsoft/powershell/7 -type f -exec chmod 0644 {} +
        - chmod 0755 /opt/microsoft/powershell/7/pwsh
        - ln -sfn /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh
        - rm -f /tmp/powershell.tar.gz
    smoke:
      command:
        - bash
        - -lc
        - |
          set -euo pipefail
          export HOME=/var/empty
          export XDG_CONFIG_HOME=/var/empty/.config
          export XDG_DATA_HOME=/var/empty/.local/share
          export PSModulePath=/opt/microsoft/powershell/7/Modules
          export POWERSHELL_TELEMETRY_OPTOUT=1
          export POWERSHELL_UPDATECHECK=Off
          export TERM=dumb
          export NO_COLOR=1

          test "$(pwsh -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()')" = 7.6.5
          test "$(pwsh -NoLogo -NoProfile -NonInteractive -Command '$env:PSModulePath')" = /var/empty/.local/share/powershell/Modules:/usr/local/share/powershell/Modules:/opt/microsoft/powershell/7/Modules
          test ! -e /opt/microsoft/powershell/7/createdump
          test "$(stat -c '%u:%g:%a' /opt/microsoft/powershell/7/pwsh)" = '0:0:755'
          test "$(stat -c '%u:%g:%a' /etc/passwd)" = '0:0:444'
          test ! -s /etc/passwd
          test "$(stat -c '%u:%g:%a' /etc/group)" = '0:0:600'
          for path in /var/empty /var/empty/.config /var/empty/.local/share /var/empty/.local/share/powershell/Modules /usr/local/share/powershell/Modules; do
            test "$(stat -c '%u:%g' "${path}")" = '0:0'
            if find "${path}" -maxdepth 0 -perm /022 -print -quit | grep -q .; then exit 1; fi
          done
          test "$(find /opt/microsoft/powershell/7 -type f -perm /0111 | wc -l)" -eq 1
          if find /opt/microsoft/powershell/7 -type d -perm /0022 -print -quit | grep -q .; then exit 1; fi
          if find /opt/microsoft/powershell/7 -type f -perm /0022 -print -quit | grep -q .; then exit 1; fi

          cat > Main.ps1 <<'POWERSHELL'
          $values = [Console]::In.ReadToEnd().Trim() -split '\s+' | ForEach-Object { [int]$_ }
          $parallel = 1..2 | ForEach-Object -Parallel { $_ } -ThrottleLimit 1
          if (($parallel -join ',') -ne '1,2') { exit 20 }
          Set-Content -LiteralPath same-folder.txt -Value ($values[0] + $values[1])
          Get-Content -LiteralPath same-folder.txt
          POWERSHELL
          pwsh -NoLogo -NoProfile -NonInteractive -Command '& { param($path) $tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) > $null; if ($errors.Count) { $errors | ForEach-Object { [Console]::Error.WriteLine($_) }; exit 1 } }' Main.ps1
          printf '1 2\n' | pwsh -NoLogo -NoProfile -NonInteractive -File Main.ps1 | grep -Fx 3

          rm -f /tmp/aonohako-powershell-syntax-leak
          printf '%s\n' '$(Set-Content -LiteralPath /tmp/aonohako-powershell-syntax-leak -Value leaked)' > SyntaxOnly.ps1
          pwsh -NoLogo -NoProfile -NonInteractive -Command '& { param($path) $tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) > $null; if ($errors.Count) { $errors | ForEach-Object { [Console]::Error.WriteLine($_) }; exit 1 } }' SyntaxOnly.ps1
          test ! -e /tmp/aonohako-powershell-syntax-leak

          printf '%s\n' 'if (' > Broken.ps1
          if pwsh -NoLogo -NoProfile -NonInteractive -Command '& { param($path) $tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) > $null; if ($errors.Count) { $errors | ForEach-Object { [Console]::Error.WriteLine($_) }; exit 1 } }' Broken.ps1 >/dev/null 2>&1; then exit 1; fi

