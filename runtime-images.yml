shared_installs:
  node24:
    apt:
      - curl
      - xz-utils
    script:
      - export NODE_VERSION=24.15.0
      - export NODE_SHA256=472655581fb851559730c48763e0c9d3bc25975c59d518003fc0849d3e4ba0f6
      - curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
      - echo "${NODE_SHA256}  /tmp/node.tar.xz" | sha256sum -c -
      - rm -rf "/opt/node-v${NODE_VERSION}-linux-x64"
      - mkdir -p /opt
      - tar -xJf /tmp/node.tar.xz -C /opt
      - ln -sfn "/opt/node-v${NODE_VERSION}-linux-x64/bin/node" /usr/local/bin/node
      - ln -sfn "/opt/node-v${NODE_VERSION}-linux-x64/bin/node" /usr/local/bin/nodejs
      - ln -sfn "/opt/node-v${NODE_VERSION}-linux-x64/bin/npm" /usr/local/bin/npm
      - ln -sfn "/opt/node-v${NODE_VERSION}-linux-x64/bin/npx" /usr/local/bin/npx
      - rm -f /tmp/node.tar.xz

  wasmtime44:
    apt:
      - curl
      - xz-utils
    sandbox_tools:
      - wasmtime
    script:
      - export WASMTIME_VERSION=44.0.0
      - export WASMTIME_SHA256=52eba06fe9f4364aa6164a4a3eafb2ca692ba9a756cbe8137b5574871f8cbfc8
      - curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz" -o /tmp/wasmtime.tar.xz
      - echo "${WASMTIME_SHA256}  /tmp/wasmtime.tar.xz" | sha256sum -c -
      - install -d /tmp/wasmtime
      - tar -xJf /tmp/wasmtime.tar.xz -C /tmp/wasmtime --strip-components=1
      - install -m 0755 /tmp/wasmtime/wasmtime /usr/local/bin/wasmtime
      - rm -rf /tmp/wasmtime /tmp/wasmtime.tar.xz
      - test -x /usr/local/bin/wasmtime

  libobjc16:
    script:
      - apt-get update -o APT::Get::List-Cleanup=false && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -t sid libobjc-16-dev && find /var/lib/apt/lists -mindepth 1 -delete

  freebasic:
    apt:
      - curl
      - gcc
      - g++
      - libc6-dev
      - libncurses-dev
    script:
      - export FREEBASIC_VERSION=1.10.1
      - echo 'deb http://deb.debian.org/debian bullseye main' > /etc/apt/sources.list.d/aonohako-freebasic-bullseye.list
      - apt-get update -o APT::Get::List-Cleanup=false
      - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libtinfo5
      - rm -f /etc/apt/sources.list.d/aonohako-freebasic-bullseye.list
      - rm -f /var/lib/apt/lists/deb.debian.org_debian_dists_bullseye_*
      - curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "https://downloads.sourceforge.net/project/fbc/FreeBASIC-${FREEBASIC_VERSION}/Binaries-Linux/FreeBASIC-${FREEBASIC_VERSION}-linux-x86_64.tar.gz" -o /tmp/freebasic.tar.gz
      - rm -rf /opt/freebasic
      - mkdir -p /opt/freebasic
      - tar -xzf /tmp/freebasic.tar.gz -C /opt/freebasic --strip-components=1
      - printf '%s\n' '#!/usr/bin/env bash' 'exec /opt/freebasic/bin/fbc "$@"' > /usr/local/bin/fbc
      - chmod 0755 /usr/local/bin/fbc
      - rm -f /tmp/freebasic.tar.gz

  gforth:
    script:
      - echo 'deb http://deb.debian.org/debian sid main' > /etc/apt/sources.list.d/aonohako-gforth-sid.list
      - apt-get update -o APT::Get::List-Cleanup=false
      - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -t sid gforth
      - find /var/lib/apt/lists -mindepth 1 -delete

  shell_runtime:
    apt:
      - bash=5.2.37-2+b9
      - dash=0.5.12-12
      - zsh=5.9-8+b23
      - zsh-common=5.9-8
      - fish=4.0.2-1
      - fish-common=4.0.2-1
      - diffutils
      - findutils
      - grep
      - mawk
      - sed
    sandbox_tools:
      - bash
      - dash
      - zsh
      - fish
    script:
      - test "$(dpkg-query -W -f='${Version}' bash)" = 5.2.37-2+b9
      - test "$(dpkg-query -W -f='${Version}' dash)" = 0.5.12-12
      - test "$(dpkg-query -W -f='${Version}' zsh)" = 5.9-8+b23
      - test "$(dpkg-query -W -f='${Version}' zsh-common)" = 5.9-8
      - test "$(dpkg-query -W -f='${Version}' fish)" = 4.0.2-1
      - test "$(dpkg-query -W -f='${Version}' fish-common)" = 4.0.2-1

  chezscheme10:
    apt:
      - chezscheme=10.0.0+dfsg-5
    sandbox_tools:
      - chezscheme
    script:
      - test "$(dpkg-query -W -f='${Version}' chezscheme)" = 10.0.0+dfsg-5
      - /usr/bin/chezscheme --version 2>&1 | grep '^10\.0\.0$'

  mlton:
    apt:
      - curl
      - gcc
      - g++
      - libc6-dev
      - libgmp-dev
      - make
    script:
      - export MLTON_VERSION=20241230
      - curl --retry 8 --retry-all-errors --retry-delay 3 --connect-timeout 20 -fL "https://downloads.sourceforge.net/project/mlton/mlton/${MLTON_VERSION}/mlton-${MLTON_VERSION}-1.amd64-linux.ubuntu-20.04_static.tgz" -o /tmp/mlton.tgz
      - tar -xzf /tmp/mlton.tgz -C /opt
      - rm -f /tmp/mlton.tgz
      - MLTON_DIR="$(find /opt -maxdepth 1 -type d -name "mlton-${MLTON_VERSION}-*" | head -n 1)"; ln -sfn "${MLTON_DIR}/bin/mlton" /usr/local/bin/mlton; ln -sfn "${MLTON_DIR}/lib/mlton" /usr/local/lib/mlton

languages:
  plain:
    install:
      apt:
        - gcc
        - g++
        - libc6-dev
        - make
    smoke:
      command:
        - /bin/sh
        - -c
        - |
          printf '%s\n' '#include <stdio.h>' 'int main(void) {' '  puts("ok");' '  return 0;' '}' > Main.c
          gcc -O2 -pipe Main.c -o Main
          [ "$(./Main)" = ok ]

  c:
    smoke:
      command:
        - /bin/sh
        - -c
        - |
          printf '%s\n' '#include <stdio.h>' 'int main(void) {' '  puts("ok");' '  return 0;' '}' > Main.c
          gcc -O2 -pipe Main.c -o Main
          [ "$(./Main)" = ok ]

  cpp:
    smoke:
      command:
        - /bin/sh
        - -c
        - |
          printf '%s\n' '#include <iostream>' 'int main() {' '  std::cout << "ok\n";' '  return 0;' '}' > Main.cpp
          g++ -O2 -pipe Main.cpp -o Main
          [ "$(./Main)" = ok ]
          printf '%s\n' \
            '#include "testlib.h"' \
            'int main(int argc, char *argv[]) {' \
            '  registerTestlibCmd(argc, argv);' \
            '  int expected = ans.readInt();' \
            '  int actual = ouf.readInt();' \
            '  if (expected != actual) quitf(_wa, "expected %d, found %d", expected, actual);' \
            '  quitf(_ok, "accepted");' \
            '}' > Checker.cpp
          g++ -std=c++17 -O2 -pipe Checker.cpp -o Checker
          printf '%s\n' '1 2' > input.txt
          printf '%s\n' '3' > answer.txt
          printf '%s\n' '3' > output.txt
          ./Checker input.txt output.txt answer.txt

  aheui:
    install:
      apt:
        - python3
        - python3-pip
      pip:
        - aheui==1.2.5
    smoke:
      command:
        - /bin/sh
        - -c
        - |
          printf '%s' '밞바밤밣받밞밞밞밦밞바밝밣바박박밦밞받밞받밞발밣받뱔희밞땨몋드떠받볋' > Main.aheui
          output="$(aheui Main.aheui 2>/tmp/aheui.stderr || true)"
          printf '%s\n' "${output}" | grep '^Hello, World!$'

  apecode:
    install:
      apt:
        - curl
        - g++
        - python3
        - python3-pip
      script:
        - export APECODE_COMMIT=c7ae98d3dfc1713ecc800422a4c815628776e1e2
        - export APECODE_SHA256=0ff71e149ec49a94211bb44b6a3d55e1290acb1387ca4f5f76a8f42f568ae629
        - curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "https://codeload.github.com/seo-rii/apecode/tar.gz/${APECODE_COMMIT}" -o /tmp/apecode.tar.gz
        - echo "${APECODE_SHA256}  /tmp/apecode.tar.gz" | sha256sum -c -
        - python3 -m pip install --break-system-packages --no-cache-dir /tmp/apecode.tar.gz
        - rm -f /tmp/apecode.tar.gz
    smoke:
      command:
        - bash
        - -lc
        - |
          printf '%s\n' 'state main {' '  return true;' '}' > Main.ape
          apecc --check Main.ape
          apecc -o Main Main.ape
          printf '%s\n' 1 3 '3 1 2' | ./Main | grep '^3 1 2$'

  asm:
    install:
      apt:
        - gcc
    smoke:
      command:
        - bash
        - -lc
        - |
          cat > Main.s <<'ASM'
          .global _start
          .section .text
          _start:
              mov $1, %rax
              mov $1, %rdi
              lea msg(%rip), %rsi
              mov $3, %rdx
              syscall
              mov $60, %rax
              xor %rdi, %rdi
              syscall
          .section .rodata
          msg:
              .ascii "ok\n"
          ASM
          gcc -nostdlib -static -no-pie Main.s -o Main
          ./Main | grep '^ok$'
          cat > Broken.s <<'ASM'
          .global _start
          .section .text
          _start:
              mov %rax, $1
          ASM
          if gcc -nostdlib -static -no-pie Broken.s -o Broken >/dev/null 2>&1; then exit 1; fi

  nasm:
    install:
      apt:
        - gcc
        - nasm
    smoke:
      command:
        - bash
        - -lc
        - |
          cat > Main.asm <<'ASM'
          default rel
          global _start
          section .text
          _start:
              mov rax, 1
              mov rdi, 1
              lea rsi, [rel msg]
              mov rdx, msg_len
              syscall
              mov rax, 60
              xor rdi, rdi
              syscall
          section .rodata
          msg: db "ok", 10
          msg_len equ $ - msg
          ASM
          nasm -felf64 Main.asm -o Main.o
          gcc -nostdlib -static -no-pie Main.o -o Main
          ./Main | grep '^ok$'
          cat > Broken.asm <<'ASM'
          global _start
          section .text
          _start:
              mov raxx, 60
          ASM
          if nasm -felf64 Broken.asm -o Broken.o >/dev/null 2>&1; then exit 1; fi

  python:
    install:
      apt:
        - python3
        - python3-pip
      pip:
        - setuptools==80.10.2
        - numpy==2.4.4
        - pandas==3.0.2
        - seaborn==0.13.2
        - matplotlib==3.10.8
        - pillow==12.3.0
        - six==1.17.0
        - qiskit==2.4.0
        - pyparsing==3.3.2
        - pylatexenc==2.10
        - jax[cpu]==0.10.0
      script:
        - python3 -m pip install --break-system-packages --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu torchvision==0.26.0+cpu
    smoke:
      command:
        - python3
        - -c
        - |
          import jax.numpy as jnp
          import os
          import pathlib
          import numpy as np
          import pandas as pd
          import PIL.Image
          import qiskit
          import seaborn as sns
          import torch
          total = int(np.arange(5).sum())
          assert int(pd.Series([1, 2, 3]).sum()) == 6
          assert torch.tensor([1, 2]).sum().item() == 3
          assert int(jnp.arange(5).sum()) == 10
          assert callable(PIL.Image.new)
          assert callable(qiskit.QuantumCircuit)
          assert sns.__version__
          assert "/usr/local/lib/aonohako/python" in os.environ.get("PYTHONPATH", "")
          pathlib.Path("same-folder.txt").write_text(str(total), encoding="utf-8")
          assert pathlib.Path("same-folder.txt").read_text(encoding="utf-8") == "10"

  pypy:
    install:
      apt:
        - pypy3
    smoke:
      command:
        - pypy3
        - -c
        - |
          import sys
          from pathlib import Path
          assert sys.implementation.name == "pypy"
          Path("same-folder.txt").write_text("ok", encoding="utf-8")
          print(Path("same-folder.txt").read_text(encoding="utf-8"))

  java:
    install:
      apt:
        - bash
        - default-jdk-headless
    smoke:
      command:
        - bash
        - -lc
        - |
          printf '%s\n' 'public class Main {' '  public static void main(String[] args) {' '    System.out.println("ok");' '  }' '}' > Main.java
          javac --release 11 -encoding UTF-8 Main.java
          printf '%s\n' 'Manifest-Version: 1.0' 'Main-Class: Main' '' > MANIFEST.MF
          jar cfm Main.jar MANIFEST.MF Main.class
          java -XX:ReservedCodeCacheSize=64m -XX:-UseCompressedClassPointers -Xmx128m -Xss1m -XX:MaxDirectMemorySize=16m -XX:MaxMetaspaceSize=64m -Dfile.encoding=UTF-8 -XX:+UseSerialGC -DONLINE_JUDGE=1 -jar Main.jar | grep '^ok$'

  groovy:
    install:
      apt:
        - bash
        - default-jdk-headless
        - groovy
    smoke:
      command:
        - bash
        - -lc
        - |
          cat > Main.groovy <<'GROOVY'
          class Main {
              static void main(String[] args) {
                  new File("same-folder.txt").text = "ok"
                  println new File("same-folder.txt").text.trim()
              }
          }
          GROOVY
          groovyc -d . Main.groovy
          shopt -s nullglob
          groovy_jars=(/usr/share/groovy/embeddable/groovy-all*.jar /usr/share/java/groovy-all*.jar /usr/share/java/groovy*.jar)
          groovy_cp='.'
          for jar in "${groovy_jars[@]}"; do groovy_cp="${groovy_cp}:${jar}"; done
          java -Xmx128m -Xss1m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=32m -XX:MaxDirectMemorySize=16m -XX:MaxMetaspaceSize=192m -XX:CompressedClassSpaceSize=64m -Dfile.encoding=UTF-8 -DONLINE_JUDGE=1 -cp "${groovy_cp}" Main | grep '^ok$'
          cat > Broken.groovy <<'GROOVY'
          class Broken {
              static void main(String[] args) {
                  println(
              }
          }
          GROOVY
          if groovyc -d . Broken.groovy >/dev/null 2>&1; then exit 1; fi

  scala:
    install:
      apt:
        - bash
        - default-jdk-headless
        - scala
    smoke:
      command:
        - bash
        - -lc
        - |
          printf '%s\n' 'object Main extends App {' '  val path = new java.io.File("same-folder.txt")' '  val writer = new java.io.PrintWriter(path, "UTF-8")' '  writer.write("ok")' '  writer.close()' '  println(scala.io.Source.fromFile(path, "UTF-8").mkString.trim)' '}' > Main.scala
          scalac Main.scala
          shopt -s nullglob
          scala_jars=(/usr/share/java/scala*.jar)
          scala_cp='.'
          for jar in "${scala_jars[@]}"; do scala_cp="${scala_cp}:${jar}"; done
          java -Xmx128m -Xss1m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=32m -XX:MaxDirectMemorySize=16m -XX:MaxMetaspaceSize=192m -XX:CompressedClassSpaceSize=64m -Dfile.encoding=UTF-8 -DONLINE_JUDGE=1 -cp "${scala_cp}" Main | grep '^ok$'

  javascript:
    install:
      shared:
        - node24
    smoke:
      command:
        - bash
        - -lc
        - |
          cat > Main.js <<'JS'
          const fs = require('fs');
          fs.writeFileSync('same-folder.txt', 'ok');
          console.log(fs.readFileSync('same-folder.txt', 'utf8'));
          JS
          node --disable-wasm-trap-handler --max-old-space-size=64 --max-semi-space-size=1 --stack-size=2048 Main.js | grep '^ok$'

  assemblyscript:
    install:
      shared:
        - node24
        - wasmtime44
      apt:
        - curl
        - wabt
      sandbox_tools:
        - aonohako-assemblyscript-compile
        - asc
        - node
        - wasm-validate
      script:
        - export ASSEMBLYSCRIPT_VERSION=0.28.20
        - export ASSEMBLYSCRIPT_SHA256=26696c1bbb716bd85a0fbd38c7efbda186c83bc648ba4f78369d432081b4b1cb
        - export ASSEMBLYSCRIPT_WASI_SHIM_VERSION=0.1.0
        - export ASSEMBLYSCRIPT_WASI_SHIM_SHA256=e8b4410255e6f86cb96c2ce1d191fa9a6b45d274f0f506c4132e8075634ea005
        - export BINARYEN_VERSION=131.0.0-nightly.20260721
        - export BINARYEN_SHA256=ed375d90d259924799147788d66ed70ce6e65454b69df577e09f2c4d17c00f6c
        - export LONG_VERSION=5.3.2
        - export LONG_SHA256=68033e466773df7d52c9e59341bb729d83716cd920c56460395724456d646b26
        - curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "https://registry.npmjs.org/assemblyscript/-/assemblyscript-${ASSEMBLYSCRIPT_VERSION}.tgz" -o /tmp/assemblyscript.tgz
        - curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "https://registry.npmjs.org/@assemblyscript/wasi-shim/-/wasi-shim-${ASSEMBLYSCRIPT_WASI_SHIM_VERSION}.tgz" -o /tmp/assemblyscript-wasi-shim.tgz
        - curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "https://registry.npmjs.org/binaryen/-/binaryen-${BINARYEN_VERSION}.tgz" -o /tmp/binaryen.tgz
        - curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "https://registry.npmjs.org/long/-/long-${LONG_VERSION}.tgz" -o /tmp/long.tgz
        - echo "${ASSEMBLYSCRIPT_SHA256}  /tmp/assemblyscript.tgz" | sha256sum -c -
        - echo "${ASSEMBLYSCRIPT_WASI_SHIM_SHA256}  /tmp/assemblyscript-wasi-shim.tgz" | sha256sum -c -
        - echo "${BINARYEN_SHA256}  /tmp/binaryen.tgz" | sha256sum -c -
        - echo "${LONG_SHA256}  /tmp/long.tgz" | sha256sum -c -
        - env NPM_CONFIG_PREFIX=/usr/local npm install --global --offline --ignore-scripts --no-audit --no-fund /tmp/assemblyscript.tgz /tmp/assemblyscript-wasi-shim.tgz /tmp/binaryen.tgz /tmp/long.tgz
        - rm -f /tmp/assemblyscript.tgz /tmp/assemblyscript-wasi-shim.tgz /tmp/binaryen.tgz /tmp/long.tgz
        - test "$(asc --version)" = "Version ${ASSEMBLYSCRIPT_VERSION}"
    smoke:
      command:
        - bash
        - -lc
        - |
          set -euo pipefail
          cat > Main.ts <<'ASSEMBLYSCRIPT'
          const buffer = new ArrayBuffer(65536);
          const count = process.stdin.read(buffer);
          const bytes = Uint8Array.wrap(buffer);
          let sum: i64 = 0;
          let value: i64 = 0;
          let sign: i64 = 1;
          let active = false;
          for (let i = 0; i < count; ++i) {
            const byte = bytes[i];
            if (byte == 45) {
              sign = -1;
            } else if (byte >= 48 && byte <= 57) {
              value = value * 10 + <i64>(byte - 48);
              active = true;
            } else if (active) {
              sum += sign * value;
              value = 0;
              sign = 1;
              active = false;
            }
          }
          if (active) sum += sign * value;
          console.log(sum.toString());
          ASSEMBLYSCRIPT
          aonohako-assemblyscript-compile "${PWD}/Main.ts" "${PWD}/Main.wasm"
          wasm-validate Main.wasm
          test "$(printf '%s\n' '-4 17' | wasmtime run -O memory-reservation=33554432 -O memory-reservation-for-growth=0 -O memory-guard-size=65536 -W max-memory-size=33554432 -W max-memories=1 -W max-instances=1 -W max-tables=1 -W max-table-elements=65536 -W max-wasm-stack=1048576 -W trap-on-grow-failure=y Main.wasm)" = 13
          printf '%s\n' 'const broken: i32 = "nope";' > Broken.ts
          if aonohako-assemblyscript-compile "${PWD}/Broken.ts" "${PWD}/Broken.wasm" >/dev/null 2>&1; then exit 1; fi
          test ! -e Broken.wasm

  factor:
    install:
      apt:
        - curl
        - libstdc++6
      sandbox_tools:
        - factor
      script:
        - export FACTOR_VERSION=0.101
        - export FACTOR_SHA256=9f971e935414c0d46d9090632464d66994ee797bacc91cc8b739db3b0857a25a
        - curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "https://downloads.factorcode.org/releases/${FACTOR_VERSION}/factor-linux-x86-64-${FACTOR_VERSION}.tar.gz" -o /tmp/factor.tar.gz
        - echo "${FACTOR_SHA256}  /tmp/factor.tar.gz" | sha256sum -c -
        - install -d -m 0755 /opt/factor
        - tar -xzf /tmp/factor.tar.gz -C /opt/factor --strip-components=1
        - rm -f /tmp/factor.tar.gz
        - chmod -R a+rX /opt/factor
        - ln -sfn /opt/factor/factor /usr/local/bin/factor
        - factor -version | grep '^Factor 0\.101 '
    smoke:
      command:
        - bash
        - -lc
        - |
          set -euo pipefail
          cat > Main.factor <<'FACTOR'
          USING: io math math.parser prettyprint sequences splitting ;
          readln split-words [ string>number ] map-sum .
          FACTOR
          /opt/factor/factor -no-user-init -no-signals -q -datastack=256 -retainstack=256 -callstack=1024 -callbacks=256 /usr/local/lib/aonohako/factor_check.factor Main.factor
          test "$(printf '%s\n' '-4 17' | /opt/factor/factor -no-user-init -no-signals -q -datastack=256 -retainstack=256 -callstack=1024 -callbacks=256 -young=2 -aging=4 -tenured=192 -codeheap=96 Main.factor)" = 13
          cat > SyntaxOnly.factor <<'FACTOR'
          USING: io.encodings.utf8 io.files ;
          "leak" "aonohako-factor-parser-leak" utf8 set-file-contents
          FACTOR
          /opt/factor/factor -no-user-init -no-signals -q -datastack=256 -retainstack=256 -callstack=1024 -callbacks=256 /usr/local/lib/aonohako/factor_check.factor SyntaxOnly.factor
          test ! -e aonohako-factor-parser-leak
          printf '%s\n' 'USING: io kernel ;' 'this-word-does-not-exist' > Broken.factor
          if /opt/factor/factor -no-user-init -no-signals -q -datastack=256 -retainstack=256 -callstack=1024 -callbacks=256 /usr/local/lib/aonohako/factor_check.factor Broken.factor >/dev/null 2>&1; then exit 1; fi

  coffeescript:
    install:
      apt:
        - coffeescript
      script:
        - ln -sfn /usr/bin/coffee /usr/local/bin/coffee
    smoke:
      command:
        - bash
        - -lc
        - |
