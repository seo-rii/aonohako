  uhmlang:
    install:
      apt:
        - git
      script:
        - ln -sfn /usr/local/go/bin/go /usr/local/bin/go
        - ln -sfn /usr/local/go/bin/gofmt /usr/local/bin/gofmt
        - |
          (
            set -euo pipefail
            # Reviewed source from the maintained fork; never follow a moving branch.
            revision=683e4c04ef48ecec27e5c950eba2c36eab794887
            work="$(mktemp -d)"
            trap 'rm -rf -- "$work"' EXIT
            git init --quiet "$work/source"
            git -C "$work/source" remote add origin https://github.com/seo-rii/umjunsik-lang.git
            git -C "$work/source" fetch --quiet --depth=1 origin "$revision"
            git -C "$work/source" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$work/source" rev-parse HEAD)" = "$revision"
            # Keep Go settings and caches local to this stdlib-only build.
            unset GOROOT
            export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=
            export GOPROXY=off GOSUMDB=off CGO_ENABLED=0
            export GOCACHE="$work/go-cache" GOMODCACHE="$work/go-modcache"
            cd "$work/source/umjunsik-lang-go"
            /usr/local/go/bin/go build -trimpath -o "$work/umjunsik-lang-go" .
            UHMLANG_BINARY="$work/umjunsik-lang-go" \
              /usr/local/go/bin/go test -count=1 -timeout=120s ./...
            install -m 0755 "$work/umjunsik-lang-go" /usr/local/bin/umjunsik-lang-go
            install -Dm 0644 "$work/source/LICENSE" /usr/local/share/licenses/umjunsik-lang-go/LICENSE
          )
        - ln -sfn /usr/local/bin/umjunsik-lang-go /usr/bin/umjunsik-lang-go
    smoke:
      command:
        - bash
        - -lc
        - |
          set -euo pipefail
          printf '%s\n' '어떻게' '식........... ........ㅋ' '이 사람이름이냐ㅋㅋ' > Hello.uhm
          output="$(timeout 5s /usr/bin/umjunsik-lang-go Hello.uhm)"
          test "$output" = X
          printf '%s\n' '어떻게' '' '엄식?' '어엄식?' '' '동탄어?준... ....' '' '엄어,' '어엄어어.' '' '준.. ...' '식어어!' '' '이 사람이름이냐ㅋㅋ' > Main.uhm
          output="$(printf '5 1\n' | timeout 5s /usr/bin/umjunsik-lang-go Main.uhm)"
          test "$output" = 6
          printf '%s\n' '어떻게' '준....' '식.!' '식..!' '이 사람이름이냐ㅋㅋ' > Jump.uhm
          output="$(timeout 5s /usr/bin/umjunsik-lang-go Jump.uhm)"
          test "$output" = 2
          printf '%s\n' '어떻게' '준......' '' '' '식.!' '식..!' '이 사람이름이냐ㅋㅋ' > Blank.uhm
          output="$(timeout 5s /usr/bin/umjunsik-lang-go Blank.uhm)"
          test "$output" = 2
          printf '%s\n' '어떻게' '엄....' '식어.,!' '식ㅋ' '식어,.!' '이 사람이름이냐ㅋㅋ' > Mixed.uhm
          output="$(timeout 5s /usr/bin/umjunsik-lang-go Mixed.uhm)"
          test "$output" = $'4\n4'
